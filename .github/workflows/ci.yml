name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.80.1'
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Build workspace
        run: cargo build --workspace

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.80.1'
      - name: Native tool versions
        run: |
          cmake --version
          c++ --version
      - name: Build C++ SDK when present
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --parallel 2
            ctest --test-dir build --output-on-failure
          else
            echo 'CMake SDK not added yet; Rust job is authoritative for this RED phase.'
          fi

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject obvious committed secrets
        shell: bash
        run: |
          if git grep -nE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,})' -- ':!docs/**'; then
            echo 'Potential secret material found.' >&2
            exit 1
          fi
          echo 'No obvious committed secret patterns detected.'
