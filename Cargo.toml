[workspace]
members = [
    "rust/signal-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "LicenseRef-Proprietary"
rust-version = "1.78"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
sha2 = "0.10"
