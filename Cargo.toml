[workspace]
resolver = "2"
members = [
    "rust/signal-core",
    "rust/signal-features",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
version = "0.1.0"
authors = ["NavisWORLD"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
sha2 = "0.10"
thiserror = "1.0"
rustfft = "6.2"
