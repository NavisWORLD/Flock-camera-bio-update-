[workspace]
members = [
    "rust/signal-core",
    "rust/signal-features",
    "rust/signal-ledger",
    "rust/policy-engine",
    "rust/flock-adapter",
    "rust/ffi",
    "services/event-correlator",
    "services/gateway",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
sha2 = "0.10"
rustfft = "6"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
zeroize = "=1.8.1"
rand_core = { version = "0.6", features = ["getrandom"] }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
