services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flock_signal}
      POSTGRES_USER: ${POSTGRES_USER:-flock_signal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - flock_signal_pg:/var/lib/postgresql/data
      - ../../database/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flock_signal} -d ${POSTGRES_DB:-flock_signal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    build:
      context: ../..
      dockerfile: install/docker/Dockerfile
    environment:
      FLOCK_SIGNAL_BIND: 0.0.0.0:8080
      FLOCK_SIGNAL_API_TOKEN: ${FLOCK_SIGNAL_API_TOKEN:?set FLOCK_SIGNAL_API_TOKEN}
      FLOCK_SIGNAL_DATABASE_URL: postgresql://${POSTGRES_USER:-flock_signal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flock_signal}
    ports:
      - "${FLOCK_SIGNAL_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  flock_signal_pg:
