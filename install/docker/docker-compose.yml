services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: flock_signal
      POSTGRES_USER: flock_signal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flock_signal_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flock_signal -d flock_signal"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - flock_signal_pg:/var/lib/postgresql/data
      - ../../database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  gateway:
    build:
      context: ../..
      dockerfile: install/docker/Dockerfile
    environment:
      FLOCK_SIGNAL_BIND: 0.0.0.0:8080
      FLOCK_SIGNAL_DATABASE_URL: postgresql://flock_signal:${POSTGRES_PASSWORD:-flock_signal_dev}@postgres:5432/flock_signal
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  flock_signal_pg:
